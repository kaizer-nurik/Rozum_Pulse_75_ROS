services:
  moveit2:
    build:
      context: .
      dockerfile: Dockerfile
    image: rozum_pulse_75_ros:latest
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ${PWD}:/workspace/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 189:* rmw'

    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
