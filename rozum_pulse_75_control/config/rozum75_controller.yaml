controller_manager:
  ros__parameters:
    update_rate: 10  # Hz
    rozum_75_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    rozum_joint_controller:
      type: custom_joint_trajectory_controller/JointTrajectoryController


rozum_75_joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

rozum_joint_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
    set_last_command_interface_value_as_state_on_activation: false
    
