# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 10  # Hz
    rozum_75_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    rozum_joint_controller:
      type: custom_joint_trajectory_controller/JointTrajectoryController
    gripper_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    dh_ag95_gripper_controller:
      type: position_controllers/GripperActionController

    # forward_position_controller:
    #   type: forward_command_controller/ForwardCommandController

gripper_joint_state_broadcaster:
  ros__parameters:
    joint: left_outer_knuckle_joint

# gripper action controller for moveit
dh_ag95_gripper_controller:
  ros__parameters:
    default: true
    joint: left_outer_knuckle_joint

# forward command controller for easier operation
forward_position_controller:
  ros__parameters:
    joints:
      - left_outer_knuckle_joint
    interface_name: position


rozum_75_joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

rozum_joint_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
    set_last_command_interface_value_as_state_on_activation: false
    
